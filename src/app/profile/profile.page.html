<ion-content [fullscreen]="true">
  <div class="header-card">
    <h1 class="title">Mi Perfil</h1>
    
    <div class="user-info">
      <div class="avatar">
        <ion-icon name="person-outline"></ion-icon>
      </div>
      <div class="user-data">
        <h2>Nombre</h2>
        <div class="badges">
          <span class="badge pedidos">pedidos</span>
          <span class="badge puntos">puntos</span>
        </div>
      </div>
    </div>
  </div>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Información de Contacto</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-item lines="none">
        <ion-icon name="call-outline" slot="start"></ion-icon>
        <ion-label>+57 número</ion-label>
      </ion-item>
      <ion-item lines="none">
        <ion-icon name="mail-outline" slot="start"></ion-icon>
        <ion-label>correo@gmail.com</ion-label>
      </ion-item>
      <ion-item lines="none">
        <ion-icon name="location-outline" slot="start"></ion-icon>
        <ion-label>dirección</ion-label>
      </ion-item>
    </ion-card-content>
  </ion-card>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Opciones</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-item button detail="false" lines="none">
        <ion-icon name="location-outline" color="danger" slot="start"></ion-icon>
        <ion-label>Mis Direcciones</ion-label>
      </ion-item>
      <ion-item button detail="false" lines="none">
        <ion-icon name="card-outline" slot="start"></ion-icon>
        <ion-label>Métodos de Pago</ion-label>
      </ion-item>
      <ion-item button detail="false" lines="none">
        <ion-icon name="star-outline" color="warning" slot="start"></ion-icon>
        <ion-label>Mis Reseñas</ion-label>
      </ion-item>
      <ion-item button detail="false" lines="none">
        <ion-icon name="settings-outline" slot="start"></ion-icon>
        <ion-label>Configuración</ion-label>
      </ion-item>
    </ion-card-content>
  </ion-card>

<ion-card>
  <ion-card-header>
    <ion-card-title>Pedidos Recientes</ion-card-title>
  </ion-card-header>

  <ion-card-content>
    <ion-list>
      <ion-item lines="none">
        <ion-label>
          <h2>#Orden</h2>
          <p>Fecha</p>
          <p>Pedido</p>
        </ion-label>
        <div class="pedido-info" slot="end">
          <div class="precio">$precio</div>
          <ion-badge color="light">Entregado</ion-badge>
        </div>
      </ion-item>

      <ion-item lines="none">
        <ion-label>
          <h2>#Orden</h2>
          <p>Fecha</p>
          <p>Pedido</p>
        </ion-label>
        <div class="pedido-info" slot="end">
          <div class="precio">$precio</div>
          <ion-badge color="light">Entregado</ion-badge>
        </div>
      </ion-item>
    </ion-list>
  </ion-card-content>
</ion-card>

  <div class="logout-btn">
    <ion-button expand="block" fill="outline" color="danger">
      <ion-icon name="log-out-outline" slot="start"></ion-icon>
      Cerrar Sesión
    </ion-button>
  </div>
</ion-content>
